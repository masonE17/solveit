<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A math quiz app that helps students practice their math skills">
    <meta name="keywords" content="HTML, CSS, JavaScript, Math">
    <meta name="author" content="Mason E.">
    <title>SolveIt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>SolveIt</h1>
            <h4>Welcome to SolveIt!</h4>
            <p>Test your math skills with our interactive quiz!</p>
        </div>
        <div class="quiz-container">
            <h1>Question #1</h1>
            <h3>1/10 cards</h3>
            <h4>What is 5 + 3?</h4>
            <div class="question-container">
                <p>A: 7</p>
                <p>B: 8</p>
                <p>C: 6</p>
                <p>D: 11</p>
            </div>
            <div class="feedback-container">
                <h1>Congratulations! Correct</h1>
                <h1>Sorry... Incorrect</h1>
            </div>
            <div class="submit-container">
                <button>Submit Answer</button>
            </div>
            <div class="next-container">
                <button>Next Question</button>
            </div>
            <div class="footer-container">
                <h1>Created by Mason E.</h1>
                <p>Always griding code and math for the love of it.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/e3e7c7dc31.js" crossorigin="anonymous"></script>
</body>
</html>
