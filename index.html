<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A math quiz app that helps students practice their math skills">
    <meta name="keywords" content="HTML, CSS, JavaScript, Math">
    <meta name="author" content="Mason E.">
    <title>SolveIt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body onload="displayQuestion(0)">
    <div class="container">
        <div class="header-container">
            <div class="header-icon">
                <i class="fa-solid fa-calculator"></i>
            </div>
            <div class="header-content">
                <h1 class="header-title-text">SolveIt</h1>
                <div class="header-bar"></div>
                <h4 class="header-main-text">Welcome to SolveIt!</h4>
                <p class="header-sub-text">Test your math skills with our interactive quiz!</p>
            </div>
            <div class="header-icon">
                <i class="fa-solid fa-square-root-variable"></i>
            </div>
        </div>
        <div class="quiz-container">
            <h1 class="quiz-header"></h1>
            <h3 class="quiz-total-questions"></h3>
            <div class="quiz-line"></div>
            <p class="quiz-question"></p>
            <div class="question-container">
                <input type="text" class="question-option" placeholder="Enter your answer here">
            </div>
        </div>
        <div class="feedback-container">
            <div class="feedback-text-container hidden"></div>
            <div class="button-container">
                <button class="submit-button">Submit Answer</button>
                <button class="next-button hidden" >Next Question</button>
                <button class="result-button hidden">View Results</button>
            </div>
        </div>
        <div class="footer-container">
            <h1 class="footer-main">Created by Mason E.</h1>
            <p class="footer-sub">Always grinding code and math for the love of it.</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/e3e7c7dc31.js" crossorigin="anonymous"></script>
</body>
</html>
